<svg viewBox="0 0 420 380" style="max-width:440px" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrative reliability diagram: a calibrated model follows the diagonal, an over-confident one falls below it">
<rect x="60" y="20" width="320" height="300" class="f-grid"/>
<line x1="60" y1="170" x2="380" y2="170" class="f-grid"/><line x1="220" y1="20" x2="220" y2="320" class="f-grid"/>
<line x1="60" y1="320" x2="380" y2="20" class="f-line" stroke-dasharray="6 5"/>
<polyline points="60,318 124,300 188,268 252,230 316,180 380,140" class="f-amber-stroke"/>
<polyline points="60,320 124,262 188,203 252,140 316,82 380,24" class="f-blue-stroke"/>
<text x="220" y="350" text-anchor="middle" class="f-text">stated confidence</text>
<text x="22" y="170" text-anchor="middle" transform="rotate(-90 22 170)" class="f-text">observed accuracy</text>
<text x="60" y="338" text-anchor="middle" class="f-small">0</text><text x="380" y="338" text-anchor="middle" class="f-small">1</text>
<rect x="76" y="34" width="12" height="4" class="f-blue"/><text x="94" y="40" class="f-small">calibrated: “95%” means 95%</text>
<rect x="76" y="52" width="12" height="4" class="f-amber"/><text x="94" y="58" class="f-small">over-confident</text>
<text x="380" y="372" text-anchor="end" class="f-small">illustration, not measured data</text>
</svg>
