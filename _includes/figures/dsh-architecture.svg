<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DeepSeek Harness: every runtime service is a swappable plugin around the Cordis core">
<defs><marker id="dsh-a-{{ include.id }}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-arrow"/></marker></defs>
<rect x="260" y="140" width="200" height="80" rx="12" class="f-accent"/>
<text x="360" y="175" text-anchor="middle" class="f-strong">Cordis core</text>
<text x="360" y="196" text-anchor="middle" class="f-small">load · unload · roll back side effects</text>
<rect x="30" y="30" width="200" height="70" rx="10" class="f-box-dash"/>
<text x="130" y="60" text-anchor="middle" class="f-text">Model adapter</text>
<text x="130" y="80" text-anchor="middle" class="f-small">V4-Flash · V4-Pro · self-hosted</text>
<rect x="260" y="20" width="200" height="70" rx="10" class="f-box-dash"/>
<text x="360" y="50" text-anchor="middle" class="f-text">Agent loop</text>
<text x="360" y="70" text-anchor="middle" class="f-small">itself a plugin</text>
<rect x="490" y="30" width="200" height="70" rx="10" class="f-box-dash"/>
<text x="590" y="60" text-anchor="middle" class="f-text">Tool registry</text>
<text x="590" y="80" text-anchor="middle" class="f-small">shell · edit · web search</text>
<rect x="30" y="260" width="200" height="70" rx="10" class="f-box-dash"/>
<text x="130" y="290" text-anchor="middle" class="f-text">Session log</text>
<text x="130" y="310" text-anchor="middle" class="f-small">append-only → cache-friendly</text>
<rect x="260" y="270" width="200" height="70" rx="10" class="f-box-dash"/>
<text x="360" y="300" text-anchor="middle" class="f-text">Modes</text>
<text x="360" y="320" text-anchor="middle" class="f-small">full · code · minimal · creator</text>
<rect x="490" y="260" width="200" height="70" rx="10" class="f-box-dash"/>
<text x="590" y="290" text-anchor="middle" class="f-text">Sub-agents</text>
<text x="590" y="310" text-anchor="middle" class="f-small">Claude Code · Codex</text>
<path d="M230,80 L270,140" class="f-line" marker-end="url(#dsh-a-{{ include.id }})"/>
<path d="M360,90 L360,138" class="f-line" marker-end="url(#dsh-a-{{ include.id }})"/>
<path d="M490,80 L450,140" class="f-line" marker-end="url(#dsh-a-{{ include.id }})"/>
<path d="M230,280 L270,220" class="f-line" marker-end="url(#dsh-a-{{ include.id }})"/>
<path d="M360,270 L360,222" class="f-line" marker-end="url(#dsh-a-{{ include.id }})"/>
<path d="M490,280 L450,220" class="f-line" marker-end="url(#dsh-a-{{ include.id }})"/>
<text x="700" y="352" text-anchor="end" class="f-small">dashed = swappable plugin</text>
</svg>
