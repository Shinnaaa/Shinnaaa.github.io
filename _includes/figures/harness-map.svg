<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agent harnesses by core size and openness">
<rect x="90" y="30" width="600" height="330" class="f-grid"/>
<line x1="390" y1="30" x2="390" y2="360" class="f-grid"/>
<line x1="90" y1="195" x2="690" y2="195" class="f-grid"/>
<text x="390" y="395" text-anchor="middle" class="f-text">core: minimal ← → batteries-included</text>
<text x="30" y="195" text-anchor="middle" transform="rotate(-90 30 195)" class="f-text">open / composable ↑</text>
