<text x="680" y="350" text-anchor="end" class="f-small">the vendor ships the features</text>
<rect x="120" y="70" width="170" height="62" rx="10" class="f-accent"/><text x="205" y="96" text-anchor="middle" class="f-strong">Pi</text><text x="205" y="115" text-anchor="middle" class="f-small">4 tools · &lt;1k-token prompt</text>
<rect x="300" y="100" width="190" height="62" rx="10" class="f-accent"/><text x="395" y="126" text-anchor="middle" class="f-strong">DeepSeek Harness</text><text x="395" y="145" text-anchor="middle" class="f-small">even the loop is a plugin</text>
<rect x="470" y="190" width="190" height="62" rx="10" class="f-warn"/><text x="565" y="216" text-anchor="middle" class="f-strong">OpenClaw</text><text x="565" y="235" text-anchor="middle" class="f-small">Pi inside · 20+ chat apps</text>
<rect x="450" y="262" width="220" height="62" rx="10" class="f-box"/><text x="560" y="288" text-anchor="middle" class="f-strong">Claude Code · Codex</text><text x="560" y="307" text-anchor="middle" class="f-small">opinionated, model-matched</text>
</svg>
